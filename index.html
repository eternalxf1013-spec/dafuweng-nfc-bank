<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>Web‑NFC 环境测试</title>
<style>
body{font‑family:system‑ui;padding:16px;max‑width:600px;margin:0 auto;}
button{padding:12px 16px;font‑size:16px;margin:8px 0;width:100%;}
#log{border:1px solid #ccc;padding:12px;min‑height:180px;white‑space:pre‑wrap;}
</style>
</head>
<body>
<h2>Web‑NFC 测试工具</h2>
<div>安全上下文：<span id="secureCtx"></span></div>
<div>NDEFReader支持：<span id="apiSupport"></span></div>

<button id="detectBtn">🔍检测环境</button>
<button id="scanBtn">📡启动NFC扫描（点击后贴卡片）</button>
<button id="stopBtn">⏹停止扫描</button>

<h3>日志输出</h3>
<div id="log"></div>

<script>
const secureCtxEl = document.querySelector('#secureCtx');
const apiSupportEl = document.querySelector('#apiSupport');
const detectBtn = document.querySelector('#detectBtn');
const scanBtn = document.querySelector('#scanBtn');
const stopBtn = document.querySelector('#stopBtn');
const logBox = document.querySelector('#log');

let ndef = null;

function appendLog(text){
  logBox.innerText += new Date().toLocaleTimeString() + " | " + text + "\n";
  logBox.scrollTop = logBox.scrollHeight;
}

detectBtn.addEventListener('click', ()=>{
  const secure = window.isSecureContext;
  const hasNdef = 'NDEFReader' in window;
  secureCtxEl.innerText = secure ? "✅true" : "❌false";
  apiSupportEl.innerText = hasNdef ? "✅true" : "❌false";
  appendLog(`安全上下文=${secure}，NDEFReader=${hasNdef}`);
  if(!secure){
    appendLog("⚠警告：必须HTTPS或者adb‑localhost，file:///普通http不允许NFC");
  }
  if(!hasNdef){
    appendLog("⚠警告：浏览器不支持Web‑NFC，请使用安卓原版Chrome");
  }
})

scanBtn.addEventListener('click', async ()=>{
  if(!window.isSecureContext || !('NDEFReader' in window)){
    appendLog("❌环境不满足，无法启动扫描");
    return;
  }
  try{
    ndef = new NDEFReader();
    ndef.onreading = (event)=>{
      appendLog("✅读到NFC卡片！");
      console.log(event);
      //打印原始NDEF消息
      appendLog(JSON.stringify(event.message,null,2));
    }
    ndef.onerror = (err)=>{
      appendLog("NFC错误：" + err.message);
    }
    await ndef.scan();
    appendLog("✅扫描已启动，请把NTAG215卡片贴手机NFC感应区");
  }catch(e){
    appendLog("启动扫描异常：" + e.message);
    console.error(e);
  }
})

stopBtn.addEventListener('click',async ()=>{
  if(ndef){
    try{
      await ndef.stop();
      appendLog("已停止NFC扫描");
    }catch(e){
      appendLog("停止失败:"+e.message)
    }
    ndef = null;
  }else{
    appendLog("没有正在运行的扫描");
  }
})
</script>
</body>
</html>
